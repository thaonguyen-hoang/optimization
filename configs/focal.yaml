# configs/focal.yaml — Focal Loss configuration

loss: focal

max_epochs: 1000
tol_grad: 1.0e-4
patience_inner: 5
patience_outer: 20
seed: 42

# Focal loss: Newton is skipped (Hessian not implemented for focal)
optimizers:
  - gd
  - sgd
  - nag
  - newton    # will be skipped at runtime with a warning
  - lbfgs

regularizations:
  - none
  - l2
  - l1

step_size:
  fixed:
    c_gd_nag: [0.1, 0.5, 1.0, 1.5, 1.9]
    c_newton: [0.5, 1.0]        # c=1.0 is a pure Newton step; Newton skipped for focal anyway
    # Focal loss is NOT 1/4-smooth (log(p+ε) terms → unbounded curvature), so
    # the sigmoid Lipschitz bound does not hold. Keep fixed steps small.
    c_focal: [1.0e-2, 5.0e-2, 1.0e-1]
    c_sgd: [1.0e-4, 1.0e-3, 0.01, 0.05, 0.1]
    sgd_decay_rate: [0.0, 0.001, 0.01]
  backtracking:
    alpha_init: 1.0
    beta: 0.5
    c_armijo: 1.0e-4

lbfgs:
  maxiter: 1
  m: 10

regularization:
  lambda: [1.0e-4, 1.0e-3, 0.01, 0.1]

sgd:
  batch_sizes: [1, 32, 64]

# ── Focal loss: anti-correlated (γ, α) pairs ─────────────────────────────────
# As γ increases (more dynamic balancing), α decreases (less static balancing).
# Pairs are (gamma, alpha):
#   γ=0.5: heavy reliance on static α → α=0.75 (strong positive weighting)
#   γ=2.0: paper default (Lin et al. 2017)
#   γ=5.0: mostly dynamic → α≈0.25 (near-balanced static weight)
focal:
  gamma_alpha_pairs:
    - [0.5, 0.75]
    - [1.0, 0.65]
    - [2.0, 0.50]
    - [3.0, 0.40]
    - [5.0, 0.25]
